name: LM Studio Web MCP

on:
  push:
    paths:
      - "mcp/lm-studio-web/**"
  pull_request:
    paths:
      - "mcp/lm-studio-web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp/lm-studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm run build
